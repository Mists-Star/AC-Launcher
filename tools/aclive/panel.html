<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>aclive — AC 启动器实时遥控台</title>
<style>
  :root { --bg:#0f1115; --panel:#171a20; --line:#262b33; --txt:#e6e9ef; --dim:#8b93a1; --acc:#4c8dff; }
  * { box-sizing: border-box; }
  body { margin:0; font:13px/1.5 system-ui,"Segoe UI",sans-serif; background:var(--bg); color:var(--txt); height:100vh; display:flex; flex-direction:column; }
  header { display:flex; gap:8px; align-items:center; padding:8px 10px; background:var(--panel); border-bottom:1px solid var(--line); }
  button { padding:5px 10px; border:1px solid var(--line); border-radius:6px; background:#1d2128; color:var(--txt); cursor:pointer; font:inherit; white-space:nowrap; }
  button:hover { border-color:var(--acc); color:var(--acc); }
  select { padding:5px 8px; border:1px solid var(--line); border-radius:6px; background:#1d2128; color:var(--txt); font:inherit; }
  #stat { color:var(--dim); white-space:nowrap; margin-left:auto; }
  #stage { flex:1; position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center; background:#0a0c0f; }
  #view { position:relative; box-shadow:0 2px 20px rgba(0,0,0,.5); }
  canvas { display:block; cursor:none; }
  #cur { position:absolute; left:-100px; top:-100px; width:14px; height:14px; margin:-7px 0 0 -7px; border:2px solid #fff; border-radius:50%; box-shadow:0 0 0 1px rgba(0,0,0,.6),0 0 8px rgba(0,0,0,.5); pointer-events:none; transition:transform .06s; }
  #cur.down { transform:scale(.55); }
  footer { padding:6px 12px; background:var(--panel); border-top:1px solid var(--line); color:var(--dim); display:flex; gap:16px; align-items:center; }
  #fps { color:var(--acc); min-width:64px; }
  #meta { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
</style>
</head>
<body>
<header>
  <select id="page"></select>
  <button id="reload">刷新帧</button>
  <button id="shot">截图</button>
  <span id="stat">连接中…</span>
</header>
<div id="stage"><div id="view"><canvas id="cv"></canvas><div id="cur"></div></div></div>
<footer>
  <span id="fps">-- fps</span>
  <span id="meta">--</span>
  <span style="margin-left:auto">面板的鼠标 / 键盘 / 滚轮 → 实时注入到启动器窗口</span>
</footer>
<script>
const $ = (s) => document.querySelector(s);
const cv = $('#cv'), ctx = cv.getContext('2d');
let fw = 1280, fh = 800, ws = null, frames = 0, fpsT = performance.now();
let bitmap = null;

function fit() {
  const st = $('#stage');
  const s = Math.min(st.clientWidth / fw, st.clientHeight / fh);
  $('#view').style.width = Math.floor(fw * s) + 'px';
  $('#view').style.height = Math.floor(fh * s) + 'px';
  cv.style.width = Math.floor(fw * s) + 'px';
  cv.style.height = Math.floor(fh * s) + 'px';
  cv.width = fw; cv.height = fh;
}
window.addEventListener('resize', fit);

function connect() {
  ws = new WebSocket('ws://' + location.host + '/ws');
  ws.binaryType = 'arraybuffer';
  ws.onopen = () => { $('#stat').textContent = '已连接'; };
  ws.onclose = () => { $('#stat').textContent = '断开 · 1s 重连'; setTimeout(connect, 1000); };
  ws.onmessage = (e) => {
    if (typeof e.data === 'string') {
      let m; try { m = JSON.parse(e.data); } catch { return; }
      if (m.t === 'size') { fw = m.w; fh = m.h; fit(); }
      return;
    }
    // 二进制帧 = JPEG
    const blob = new Blob([e.data], { type: 'image/jpeg' });
    createImageBitmap(blob).then(bmp => {
      if (bitmap) bitmap.close();
      bitmap = bmp;
      ctx.drawImage(bmp, 0, 0, fw, fh);
    }).catch(() => {});
    frames++;
    const now = performance.now();
    if (now - fpsT > 1000) {
      $('#fps').textContent = (frames * 1000 / (now - fpsT)).toFixed(0) + ' fps';
      frames = 0; fpsT = now;
    }
  };
}
connect();

// ── 假光标 + 坐标映射 + 输入回传 ──
const view = $('#view'), cur = $('#cur');
const toFrame = (e) => {
  const r = cv.getBoundingClientRect();
  return { x: Math.round((e.clientX - r.left) * fw / r.width), y: Math.round((e.clientY - r.top) * fh / r.height) };
};
const btnName = (b) => (b === 2 ? 'right' : b === 1 ? 'middle' : 'left');
const send = (o) => { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); };

cv.addEventListener('mousemove', (e) => {
  const vr = view.getBoundingClientRect();
  cur.style.left = (e.clientX - vr.left) + 'px';
  cur.style.top = (e.clientY - vr.top) + 'px';
  send({ t: 'mouse', kind: 'move', ...toFrame(e) });
});
cv.addEventListener('mousedown', (e) => {
  cur.classList.add('down');
  send({ t: 'mouse', kind: 'down', ...toFrame(e), button: btnName(e.button) });
  e.preventDefault();
});
window.addEventListener('mouseup', (e) => {
  cur.classList.remove('down');
  send({ t: 'mouse', kind: 'up', ...toFrame(e), button: btnName(e.button) });
});
cv.addEventListener('wheel', (e) => {
  e.preventDefault();
  const p = toFrame(e);
  send({ t: 'wheel', x: p.x, y: p.y, dx: -e.deltaX, dy: -e.deltaY });
}, { passive: false });
cv.addEventListener('contextmenu', (e) => e.preventDefault());

window.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  send({ t: 'key', kind: 'down', key: e.key, code: e.code, text: e.key.length === 1 ? e.key : '' });
  if (e.code === 'Space' || e.key.startsWith('Arrow')) e.preventDefault();
});
window.addEventListener('keyup', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  send({ t: 'key', kind: 'up', key: e.key, code: e.code });
});

// ── 顶栏控制 ──
async function ctl(body) {
  const r = await fetch('/ctl', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
  return r.json();
}
$('#reload').onclick = async () => {
  const r = await ctl({ cmd: 'info' });
  $('#meta').textContent = r.ok ? ('页面 ' + (r.pages || []).join('/')) : ('ERR ' + r.err);
  fillPages(r.pages || []);
};
$('#shot').onclick = async () => {
  const r = await ctl({ cmd: 'shot' });
  $('#meta').textContent = r.ok ? ('已存 ' + r.path) : ('ERR ' + r.err);
};
$('#page').onchange = async (e) => {
  const r = await ctl({ cmd: 'nav', key: e.target.value });
  $('#meta').textContent = r.ok ? ('→ ' + r.page) : ('ERR ' + r.err);
};

function fillPages(pages) {
  const sel = $('#page');
  if (sel.dataset.n === String(pages.length)) return;
  sel.dataset.n = String(pages.length);
  sel.innerHTML = '';
  for (const p of pages) {
    const o = document.createElement('option');
    o.value = p; o.textContent = p;
    sel.appendChild(o);
  }
}

(async function init() {
  const r = await ctl({ cmd: 'info' });
  if (r.ok) { fillPages(r.pages || []); $('#meta').textContent = '标题：' + r.title; }
})();
fit();
</script>
</body>
</html>
